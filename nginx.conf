server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de endurecimiento corporativo ASVS / SFC-007
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss: ws:;" always;

    # Sonda Kubernetes de salud (Liveness & Readiness)
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"ajedrez-junvill","framework":"vite-react-spa"}';
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché de activos estáticos inmutables
    location ~* \.(?:css|js|woff2?|svg|png|jpg|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
